name: Validate English branch

on:
  push:
    branches: [en]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rom-free-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate language separation and ROM exclusion
        run: python tools/validate_branch_separation.py --language en
      - name: Verify published patch checksums
        working-directory: releases/en/2.0.2
        run: sha256sum -c SHA256SUMS
      - name: Validate translation inputs
        run: python build.py check
      - name: Run unit tests (ROM integrations skip without local inputs)
        run: python -m unittest discover -s tools -p "test_*.py"
