name: Validate English branch

on:
  push:
    branches: [en]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rom-free-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Verify English workbook helpers
        run: |
          node --check tools/build_dialogue_review_xlsx.mjs
          node --test tools/test_build_dialogue_review_xlsx.mjs
      - name: Validate language separation and ROM exclusion
        run: python3 tools/validate_branch_separation.py --language en
      - name: Verify published patch checksums
        working-directory: releases/en/2.0.2
        run: sha256sum -c SHA256SUMS
      - name: Validate the complete English catalogue
        run: python3 tools/validate_english_catalog.py
      - name: Verify the human-review CSV is synchronized
        run: python3 tools/export_english_review_sheet.py --check
      - name: Run ROM-free unit tests
        run: |
          python3 -m unittest -v \
            tools.test_validate_branch_separation \
            tools.test_english_repository_metadata \
            tools.test_csv_to_review_xlsx \
            tools.test_validate_english_catalog \
            tools.test_english_codec \
            tools.test_english_layout \
            tools.test_locale_profiles \
            tools.test_restoration_topology \
            tools.test_english_review_workflow \
            tools.test_export_english_review_sheet
