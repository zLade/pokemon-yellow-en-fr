name: Valider la branche française

on:
  push:
    branches: [fr]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation-sans-rom:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Contrôler les sources françaises
        run: python build.py check
      - name: Contrôler la séparation et l'absence de ROM
        run: python tools/validate_branch_separation.py --language fr
      - name: Vérifier le patch publié
        working-directory: releases/fr/2.0.13
        run: sha256sum -c SHA256SUMS
      - name: Exécuter les tests sans ROM
        run: python -m unittest discover -s tools -p "test_*.py" -v
